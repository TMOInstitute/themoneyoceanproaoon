<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Money Ocean Pro | Launching Soon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: radial-gradient(circle at center, #111a24 0%, #070a0d 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .badge {
            background: rgba(0, 200, 83, 0.1);
            color: #00e676;
            border: 1px solid #00c853;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
            display: inline-block;
        }
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            background: linear-gradient(180deg, #ffffff 0%, #8da2b5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: #94a3b8;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .cta-btn {
            background: linear-gradient(135deg, #00c853 0%, #009624 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 200, 83, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 200, 83, 0.5);
        }
        .footer {
            position: absolute;
            bottom: 25px;
            font-size: 0.85rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="badge">Next-Gen Institutional Terminal</div>
    <h1>The Money Ocean Pro</h1>
    <p>India's 1 st own AI & Options Telemetry Data Terminal Cooming Soon .</p>
    <a href="https://t.me/themoneyoceanpro" class="cta-btn" target="_blank">Join Early Access / Telegram</a>
    <div class="footer">&copy; 2026 The Money Ocean. All rights reserved.</div>
</body>
</html>
